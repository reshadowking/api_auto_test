name: API Auto Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: 拉取代码
      uses: actions/checkout@v4

    - name: 安装 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 创建 .env 配置文件
      run: |
        echo "LOGIN_EMAIL=${{ secrets.LOGIN_EMAIL }}" > config/.env
        echo "LOGIN_PWD=${{ secrets.LOGIN_PWD }}" >> config/.env
        echo "REQRES_API_KEY=${{ secrets.REQRES_API_KEY }}" >> config/.env

    - name: 安装依赖
      run: pip install -r requirements.txt

    - name: 运行测试用例
      run: pytest --alluredir=report_raw

    - name: 生成 Allure 报告
      uses: simple-elf/allure-report-action@v1.9
      if: always()
      with:
        allure_results: report_raw
        allure_history: allure-history
        keep_reports: 20

    - name: 部署报告到 GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      if: always()
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: allure-history
        publish_branch: gh-pages