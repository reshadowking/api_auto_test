name: API Auto Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: 拉取代码
      uses: actions/checkout@v4

    - name: 安装 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 创建 .env 配置文件
      run: |
        echo "LOGIN_EMAIL=${{ secrets.LOGIN_EMAIL }}" > config/.env
        echo "LOGIN_PWD=${{ secrets.LOGIN_PWD }}" >> config/.env
        echo "REQRES_API_KEY=${{ secrets.REQRES_API_KEY }}" >> config/.env

    - name: 安装依赖
      run: pip install -r requirements.txt

    - name: 运行测试用例
      run: pytest --alluredir=report_raw

    - name: 安装 Allure CLI
      if: always()
      run: |
        wget https://github.com/allure-framework/allure2/releases/download/2.30.0/allure-2.30.0.tgz
        tar -xzf allure-2.30.0.tgz
        echo "F:\360MoveData\Users\asasz\Desktop\KZZ\newtt\allure-2.30.0\bin" >> $GITHUB_PATH

    - name: 生成 Allure 报告
      if: always()
      run: ./allure-2.30.0/bin/allure generate report_raw -o allure_html --clean

    - name: 上传 HTML 测试报告
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: allure-html-report
        path: allure_html/