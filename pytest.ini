[pytest]
markers =
    get : 查询接口用例
    post : 创建接口用例
    put : 更新接口用例
    delete : 删除接口用例
    post_error : 创建接口异常用例
    put_error : 更新接口异常用例
    delete_error : 删除接口异常用例
    bookstack : 依赖本地 BookStack 服务的链路用例（CI 中自动跳过；并行模式下自动跳过）
    unit : 断言引擎/契约/清理单元测试，不依赖网络
addopts = -s --alluredir=report_raw
testpaths = test_cases
python_files = test_*.py
